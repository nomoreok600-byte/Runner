name: Make keystore
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Check password secret
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "::error::KEYSTORE_PASSWORD secret is missing or misnamed"; exit 1; fi
          if [ ${#PW} -lt 6 ]; then echo "::error::KEYSTORE_PASSWORD must be at least 6 characters"; exit 1; fi
          echo "Password secret OK"
      - name: Create keystore
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Sky parkour runner"
          base64 -w0 upload.jks > upload.jks.b64
          ls -la upload.jks*
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: upload.jks*
